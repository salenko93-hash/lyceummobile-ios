workflows:
  # Start with this workflow from Windows. It compiles the native app on
  # a cloud Mac WITHOUT signing; the resulting app cannot be installed on iPhone.
  ios-compile:
    name: LyceumMobile iOS - compile (unsigned)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
    scripts:
      - name: Test shared timetable and substitution engine
        script: swift test --jobs 2
      - name: Compile iOS app without signing
        script: |
          set -e
          xcodebuild \
            -project LyceumMobile.xcodeproj \
            -scheme LyceumMobile \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/ios \
            CODE_SIGNING_ALLOWED=NO \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            build
      - name: Package unsigned IPA for Windows USB sideloading
        script: |
          set -euo pipefail
          APP="$CM_BUILD_DIR/build/ios/Build/Products/Release-iphoneos/LyceumMobile.app"
          test -d "$APP"
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa" "$CM_BUILD_DIR/build/ios/ipa-staging/Payload"
          ditto "$APP" "$CM_BUILD_DIR/build/ios/ipa-staging/Payload/LyceumMobile.app"
          ditto -c -k --keepParent \
            "$CM_BUILD_DIR/build/ios/ipa-staging/Payload" \
            "$CM_BUILD_DIR/build/ios/ipa/LyceumMobile-unsigned.ipa"
          unzip -t "$CM_BUILD_DIR/build/ios/ipa/LyceumMobile-unsigned.ipa" > /dev/null
          unzip -Z1 "$CM_BUILD_DIR/build/ios/ipa/LyceumMobile-unsigned.ipa" \
            | grep -q '^Payload/LyceumMobile.app/Info.plist$'
    artifacts:
      - build/ios/ipa/LyceumMobile-unsigned.ipa
      - build/ios/Build/Products/Release-iphoneos/LyceumMobile.app
      - /tmp/xcodebuild_logs/*.log

  # AFTER your Apple Developer enrollment, connect an App Store Connect
  # integration under the exact name LyceumMobile_AppStore and set up
  # automatic App Store signing for bundle ID ua.edu.cunl.lyceummobile.
  ios-testflight:
    name: LyceumMobile iOS - signed IPA
    max_build_duration: 90
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: LyceumMobile_AppStore
    environment:
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: ua.edu.cunl.lyceummobile
    scripts:
      - name: Test the portable timetable engine
        script: swift test --jobs 2
      - name: Apply Apple certificates and provisioning profiles
        script: xcode-project use-profiles
      - name: Build and export signed native IPA
        script: |
          set -e
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/LyceumMobile.xcodeproj" \
            --scheme "LyceumMobile"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
